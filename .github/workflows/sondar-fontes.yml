name: Sondar fontes

on:
  workflow_dispatch:
  push:
    paths:
      - mafra/sondar_fontes.py

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout leve (só mafra/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            mafra
          sparse-checkout-cone-mode: true

      - name: Testar fontes
        run: python3 mafra/sondar_fontes.py

      - name: Gravar resultado
        run: |
          git config user.name "coleta-mafra[bot]"
          git config user.email "coleta-mafra@users.noreply.github.com"
          git add mafra/sondagem.md
          git commit -m "Sondagem de fontes a partir do GitHub Actions" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
